[project]
name = "audio-deepfake-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.2.6",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scikit-learn==1.7.2",
    "scipy>=1.18.1",
    "soundfile==0.13.1",
    "torch==2.8.0+cu126",
    "torchaudio==2.8.0+cu126",
    "tqdm>=4.66.5",
    "transformers==4.57.6",
]

[project.scripts]
audio-deepfake-detection = "audio_deepfake_detection:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[dependency-groups]
dev = [
    "pytest==8.4.2",
]
